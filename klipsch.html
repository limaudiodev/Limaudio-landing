<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles/klipch/style.css" />
    <link rel="stylesheet" href="./src/styles/swiper-bundle.min.css" />

    <title>Klipsch</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a class="headlineH3" href="#"
          >Klipsch by <br />
          LIMAUDIO</a
        >

        <ul class="content header__menu">
          <li class="active">О брендах</li>
          <li>Подбор</li>
          <li>Для кого Klipsch</li>
          <li>Наш подход</li>
          <li>
            <a class="header__tel paragraph500" href="">+7 (999) 999-99-99</a>
          </li>
        </ul>

        <a class="header__tel paragraph500" href="">+7 (999) 999-99-99</a>

        <button class="burger-btn" aria-label="Меню">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>
    </div>
    <footer></footer>
  </body>
  <script src="./src/js/swiper-bundle.min.js"></script>

  <script>
    // Ждём полной загрузки DOM
    document.addEventListener("DOMContentLoaded", function () {
      // Находим элементы
      const burgerBtn = document.querySelector(".burger-btn");
      const menu = document.querySelector(".content");

      // Создаём оверлей (тёмный фон)
      const overlay = document.createElement("div");
      overlay.classList.add("overlay");
      document.body.appendChild(overlay);

      // Функция открытия меню
      function openMenu() {
        menu.classList.add("open");
        burgerBtn.classList.add("active");
        overlay.classList.add("active");
        document.body.style.overflow = "hidden"; // Блокируем скролл страницы
      }

      // Функция закрытия меню
      function closeMenu() {
        menu.classList.remove("open");
        burgerBtn.classList.remove("active");
        overlay.classList.remove("active");
        document.body.style.overflow = ""; // Возвращаем скролл
      }

      // Функция переключения меню
      function toggleMenu() {
        if (menu.classList.contains("open")) {
          closeMenu();
        } else {
          openMenu();
        }
      }

      // Обработчик клика по бургеру
      burgerBtn.addEventListener("click", toggleMenu);

      // Закрытие по клику на оверлей
      overlay.addEventListener("click", closeMenu);

      // Закрытие при нажатии клавиши Escape
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && menu.classList.contains("open")) {
          closeMenu();
        }
      });

      // Закрытие при клике на пункт меню (опционально)
      const menuItems = document.querySelectorAll(".content li");
      menuItems.forEach(function (item) {
        item.addEventListener("click", function () {
          closeMenu();
        });
      });

      // При изменении размера окна, если меню открыто и ширина становится больше 1024px
      window.addEventListener("resize", function () {
        if (window.innerWidth > 1024 && menu.classList.contains("open")) {
          closeMenu();
        }
      });
    });
  </script>
</html>
